[project]
name = "ehcs-bench"
version = "0.1.0"
description = "English-Hebrew code-switching ASR benchmark: runner and scorer"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["jiwer==3.1.0", "huggingface_hub>=0.25"]

[project.optional-dependencies]
# Inference extras. Scoring a predictions file needs neither.
whisper = ["torch", "transformers>=4.44", "soundfile", "librosa"]
# NeMo pins: see modal_app.py for the CUDA build that is known to work.
nemo = ["nemo_toolkit[asr]==2.7.3"]

[project.scripts]
ehcs-bench = "ehcs_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ehcs_bench"]
